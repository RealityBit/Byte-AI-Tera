    <title>Byte AI Mega 3.1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 15px rgba(0, 255, 0, 0.4), inset 0 0 15px rgba(0, 255, 0, 0.1); }
            50% { box-shadow: 0 0 30px rgba(0, 255, 0, 0.7), inset 0 0 20px rgba(0, 255, 0, 0.2); }
        }

        @keyframes glow {
            0% { text-shadow: 0 0 10px rgba(0, 255, 0, 0.5); }
            50% { text-shadow: 0 0 20px rgba(0, 255, 0, 0.8); }
            100% { text-shadow: 0 0 10px rgba(0, 255, 0, 0.5); }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Courier New', monospace;
            background: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #000;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid #1a4d2e;
            background: #000;
        }

        .header-left {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(0, 255, 0, 0.6));
        }

        .app-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .mode-switch {
            background: none;
            border: none;
            color: #00ff00;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .mode-switch:hover {
            background: rgba(0, 255, 0, 0.1);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #fff;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #555;
            border: 2px solid #00ff00;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #000;
        }

        .messages {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Message Styles */
        .message {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            animation: fadeIn 0.5s ease-out;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .message:hover {
            transform: translateY(-3px);
            filter: brightness(1.15) drop-shadow(0 8px 16px rgba(0, 255, 0, 0.2));
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.user .label {
            order: 2;
        }

        .message.user .bubble {
            order: 1;
        }

        .message.bot .label {
            order: 1;
        }

        .message.bot .bubble {
            order: 2;
        }

        .label {
            font-size: 12px;
            font-weight: 600;
            color: #888;
            min-width: 40px;
            text-align: center;
            font-style: italic;
        }

        .bubble {
            max-width: 80%;
            padding: 12px 20px;
            border-radius: 24px;
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 14px;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .message.bot .bubble {
            background: rgba(45, 90, 61, 0.6);
            color: #fff;
            border: 1.5px solid rgba(0, 255, 0, 0.5);
            box-shadow: 0 8px 32px rgba(0, 255, 0, 0.1), inset 0 1px 2px rgba(255, 255, 255, 0.1);
        }

        .message.bot .bubble:hover {
            background: rgba(45, 90, 61, 0.8);
            border-color: rgba(0, 255, 0, 0.8);
            box-shadow: 0 12px 40px rgba(0, 255, 0, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.2);
        }

        .message.user .bubble {
            background: rgba(0, 255, 0, 0.5);
            color: #000;
            font-weight: 500;
            border: 1.5px solid rgba(0, 255, 0, 0.7);
            box-shadow: 0 8px 32px rgba(0, 255, 0, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.2);
        }

        .message.user .bubble:hover {
            background: rgba(0, 255, 0, 0.7);
            border-color: rgba(0, 255, 0, 0.9);
            box-shadow: 0 12px 40px rgba(0, 255, 0, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.3);
        }

        /* Input Area */
        .input-area {
            padding: 16px 24px 24px;
            background: #000;
            border-top: 1px solid #1a4d2e;
            display: flex;
            gap: 12px;
            align-items: flex-end;
            position: relative;
        }

        #queryInput {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid rgba(26, 77, 46, 0.5);
            border-radius: 24px;
            background: rgba(26, 77, 46, 0.4);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 40px;
            box-shadow: inset 0 1px 3px rgba(0, 255, 0, 0.05), 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        #queryInput::placeholder {
            color: rgba(102, 102, 102, 0.7);
            font-style: italic;
        }

        #queryInput:hover {
            background: rgba(26, 77, 46, 0.55);
            border-color: rgba(0, 255, 0, 0.3);
            box-shadow: inset 0 1px 3px rgba(0, 255, 0, 0.1), 0 6px 16px rgba(0, 255, 0, 0.1);
        }

        #queryInput:focus {
            outline: none;
            border-color: #00ff00;
            background: rgba(26, 77, 46, 0.7);
            box-shadow: inset 0 1px 3px rgba(0, 255, 0, 0.2), 0 0 20px rgba(0, 255, 0, 0.3);
        }

        /* Menu Container & Button */
        .menu-container {
            position: relative;
            flex-shrink: 0;
            display: flex;
            align-items: flex-end;
        }

        .menu-button {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(0, 255, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(0, 255, 0, 0.6);
            color: #00ff00;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-weight: bold;
            min-width: 48px;
            min-height: 48px;
            animation: pulse 3s ease-in-out infinite;
        }

        .menu-button:hover {
            background: rgba(0, 255, 0, 0.35);
            border-color: #00ff00;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.2);
            transform: scale(1.12);
            animation: none;
        }

        .menu-button:active {
            transform: scale(0.92);
        }

        /* Popup Menu */
        .menu-popup {
            position: absolute;
            bottom: 60px;
            right: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 255, 0, 0.6);
            border-radius: 12px;
            padding: 8px 0;
            min-width: 220px;
            box-shadow: 0 8px 32px rgba(0, 255, 0, 0.25), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            z-index: 1001;
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-popup.hidden {
            display: none;
        }

        .menu-title {
            padding: 8px 15px;
            font-weight: bold;
            color: #00ff00;
            border-bottom: 1px solid #00ff00;
            font-size: 12px;
        }

        .menu-item {
            padding: 10px 15px;
            background: transparent;
            border: none;
            color: #00ff00;
            text-align: left;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-item:hover {
            background: rgba(0, 255, 0, 0.15);
            padding-left: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            transform: translateX(3px);
        }

        .menu-item:active {
            transform: translateX(5px) scale(0.98);
        }

        .menu-divider {
            border: none;
            border-top: 1px solid rgba(0, 255, 0, 0.3);
            margin: 5px 0;
        }

        /* Scrollbar Styling */
        .chat-area::-webkit-scrollbar {
            width: 6px;
        }

        .chat-area::-webkit-scrollbar-track {
            background: #000;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: #1a4d2e;
            border-radius: 3px;
        }

        .chat-area::-webkit-scrollbar-thumb:hover {
            background: #2d5a3d;
        }

        /* Loading Animation */
        .loading {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .loading span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff00;
            animation: bounce 1.4s infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                opacity: 0.5;
            }
            40% {
                opacity: 1;
            }
        }


        /* Update Notification Banner */
        .update-banner {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(90deg, #1a4d2e 0%, #2d5a3d 100%);
            border-bottom: 2px solid #00ff00;
            padding: 12px 20px;
            z-index: 999;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .update-banner.show {
            display: flex;
        }

        .update-text {
            color: #00ff00;
            font-size: 14px;
            flex: 1;
        }

        .update-btn {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        .update-btn:hover {
            background: #00cc00;
            transform: scale(1.05);
        }

        .update-close {
            background: none;
            border: none;
            color: #00ff00;
            font-size: 18px;
            cursor: pointer;
            padding: 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 12px 16px;
            }

            .app-title {
                font-size: 16px;
            }

            .chat-area {
                padding: 16px;
            }

            .bubble {
                max-width: 85%;
            }

            .input-area {
                padding: 12px 16px 16px;
            }
        }
    </style>

            return context.slice(0, 5); // Return top 5 context words
        }

        // Build context-aware search query
        function buildContextQuery(query) {
            const context = getConversationContext();

            // If query is vague ("tell me more", "explain that"), use context
            if (/^(tell|show|explain|more|details|about|that|it)/.test(query.toLowerCase())) {
                if (context.length > 0) {
                    return context[0]; // Use most recent topic
                }
            }

            return query;
        }

        // Format Unix timestamp to full date/time
        function formatDateTime(unixTime) {
            if (!unixTime) return new Date().toLocaleString();
            const date = new Date(unixTime * 1000);
            return date.toLocaleString('en-US', {
                month: 'numeric',
                day: 'numeric',
                year: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
        }

        // Format Unix timestamp to readable time (relative)
        function formatTime(unixTime) {
            if (!unixTime) return 'now';
            const date = new Date(unixTime * 1000);
            const now = Date.now();
            const diff = Math.floor((now - date.getTime()) / 1000);

            if (diff < 60) return 'just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            return Math.floor(diff / 86400) + 'd ago';
        }

        async function getDictionary(word) {
            try {
                const cleanWord = word.trim().toLowerCase();
                const url = `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(cleanWord)}`;

                const res = await fetch(url);
                if (!res.ok) return null;

                if (!Array.isArray(data) || data.length === 0) return null;

                const entry = data[0];
                const word_text = entry.word;
                const phonetic = entry.phonetic || '';
                const meanings = entry.meanings || [];

                let result = `📚 ${word_text}`;
                if (phonetic) result += `\n🔊 ${phonetic}`;

                meanings.forEach((meaning, idx) => {
                    const pos = meaning.partOfSpeech;
                    result += `\n\n**${pos}**`;

                    if (meaning.definitions && meaning.definitions.length > 0) {
                        result += `\n• ${meaning.definitions[0].definition}`;
                        if (meaning.definitions[0].example) {
                            result += `\n  Example: "${meaning.definitions[0].example}"`;

                    if (meaning.synonyms && meaning.synonyms.length > 0) {
                        result += `\nSynonyms: ${meaning.synonyms.slice(0, 3).join(', ')}`;

                });

                return result;

                console.error('Dictionary error:', error);
            }
            return null;
        }

        function convertUnits(query) {
            const conversions = {
                // Length (to meters)
                'km': 1000, 'kilometer': 1000, 'kilometers': 1000,
                'm': 1, 'meter': 1, 'meters': 1,
                'cm': 0.01, 'centimeter': 0.01, 'centimeters': 0.01,
                'mm': 0.001, 'millimeter': 0.001, 'millimeters': 0.001,
                'mile': 1609.34, 'miles': 1609.34,
                'yard': 0.9144, 'yards': 0.9144,
                'feet': 0.3048, 'foot': 0.3048,
                'inch': 0.0254, 'inches': 0.0254,

                // Weight (to kg)
                'kg': 1, 'kilogram': 1, 'kilograms': 1,
                'g': 0.001, 'gram': 0.001, 'grams': 0.001,
                'lbs': 0.453592, 'lb': 0.453592, 'pound': 0.453592, 'pounds': 0.453592,
                'oz': 0.0283495, 'ounce': 0.0283495, 'ounces': 0.0283495,
                'ton': 1000, 'tons': 1000,

                // Volume (to liters)
                'liter': 1, 'liters': 1, 'l': 1,
                'ml': 0.001, 'milliliter': 0.001, 'milliliters': 0.001,
                'gallon': 3.78541, 'gallons': 3.78541,
                'quart': 0.946353, 'quarts': 0.946353,
                'pint': 0.473176, 'pints': 0.473176,
                'cup': 0.236588, 'cups': 0.236588,

                // Speed (to m/s)
                'kmh': 0.277778, 'kph': 0.277778,
                'mph': 0.44704,
                'mps': 1, 'm/s': 1,
                'knot': 0.514444, 'knots': 0.514444
            };

            const tempPattern = /(\d+\.?\d*)\s*(°?[CF]|celsius|fahrenheit)\s+(?:in|to)\s+(°?[CF]|celsius|fahrenheit)/i;
            const tempMatch = query.match(tempPattern);
            if (tempMatch) {
                const value = parseFloat(tempMatch[1]);
                const from = tempMatch[2].toUpperCase().charAt(0);
                const to = tempMatch[3].toUpperCase().charAt(0);

                let result;
                if (from === 'C' && to === 'F') result = (value * 9/5) + 32;
                else if (from === 'F' && to === 'C') result = (value - 32) * 5/9;
                else if (from === 'C' && to === 'K') result = value + 273.15;
                else if (from === 'K' && to === 'C') result = value - 273.15;
                else if (from === 'F' && to === 'K') result = (value - 32) * 5/9 + 273.15;
                else if (from === 'K' && to === 'F') result = (value - 273.15) * 9/5 + 32;
                else return null;

                return `🌡️ ${value}°${from} = ${result.toFixed(2)}°${to}`;
            }

            const unitPattern = /(\d+\.?\d*)\s*([a-z/°]+)\s+(?:in|to)\s+([a-z/°]+)/i;
            const match = query.match(unitPattern);
            if (!match) return null;

            const value = parseFloat(match[1]);
            const fromUnit = match[2].toLowerCase().trim();
            const toUnit = match[3].toLowerCase().trim();

            const fromBase = conversions[fromUnit];
            const toBase = conversions[toUnit];

            if (!fromBase || !toBase) return null;

            const result = (value * fromBase) / toBase;
            return `🧮 ${value}${fromUnit} = ${result.toFixed(4)}${toUnit}`.replace(/\.?0+$/, '');
        }

        async function learnFromWikipedia(query) {
            // Use context-aware query if needed
            const contextQuery = buildContextQuery(query);
            const cacheKey = contextQuery.toLowerCase().replace(/\s+/g, '_').replace(/[()]/g, '');

            // Check cache first
            if (cacheKey in datCache) {
                return datCache[cacheKey];
            }

            try {
                // Use Wikipedia REST API (better CORS support)
                const title = encodeURIComponent(contextQuery);
                const restUrl = `https://en.wikipedia.org/api/rest_v1/page/summary/${title}`;

                const res = await fetch(restUrl, {
                    method: 'GET',
                    headers: { 'User-Agent': getNextAgent() }
                });

                if (res.status === 404) {
                    console.warn('Wikipedia: Article not found:', query);
                    return null;
                }
                if (!res.ok) throw new Error(`Wikipedia API failed: ${res.status}`);

                const data = await res.json();
                const extract = data.extract;
                const actualTitle = data.title;

                if (!extract) {
                    console.warn('Wikipedia: No extract found for:', actualTitle);
                    return null;
                }

                console.log('Wikipedia: Got extract, extracting sentences...');

                // Extract sentences
                const sentences = [];
                const paragraphs = extract.split('\n\n');

                for (const para of paragraphs) {
                    if (para.length < 10) continue; // Lowered from 20 to get shorter extracts

                    // Split by sentence boundaries, with fallback to simple split
                    let sent = [];
                    try {
                        sent = para.split(/(?<=[.!?])\s+/);
                    } catch (e) {
                        // Fallback for browsers that don't support lookbehind
                        sent = para.split(/[.!?]\s+/);
                    }

                    for (const s of sent) {
                        if (s.length > 5 && s.length < 500) { // Expanded length range
                            if (!s.startsWith('See also') && !s.startsWith('References')) {
                                sentences.push(s.trim());
                                if (sentences.length >= 5) break;
                            }
                        }
                    }
                    if (sentences.length >= 5) break;
                }

                // If we still have no sentences, just return the whole extract as one sentence
                if (sentences.length === 0) {
                    if (extract.length > 20) {
                        sentences.push(extract.substring(0, 500)); // Take first 500 chars
                    } else {
                        return null;
                    }
                }

                // Cache result
                const result = { title: actualTitle, sentences, learned_at: new Date().toISOString() };
                datCache[cacheKey] = result;
                localStorage.setItem(DAT_CACHE_KEY, JSON.stringify(datCache));

                return result;
            } catch (error) {
                console.error('Wikipedia error:', error);
                return null;
            }
        }

        function exportAsImage() {

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const width = 800;
            const height = Math.min(chatContainer.scrollHeight, 10000);

            canvas.width = width;
            canvas.height = height;
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#333';
            ctx.font = '14px Arial';
            let y = 20;
            const lineHeight = 20;

            getChatData().forEach(msg => {
                ctx.fillStyle = msg.type === 'bot' ? '#0066cc' : '#333';
                ctx.fillText(`[${msg.label}]`, 20, y);
                y += lineHeight;

                const text = msg.content;
                const maxWidth = width - 40;
                const words = text.split(' ');
                let line = '';

                words.forEach(word => {
                    if (ctx.measureText(line + word).width > maxWidth) {
                        ctx.fillText(line, 20, y);
                        y += lineHeight;
                        line = word;
                    } else {
                        line += (line ? ' ' : '') + word;
                    }
                });
                if (line) {
                    ctx.fillText(line, 20, y);
                    y += lineHeight;
                }
                y += 10;
            });

            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'byte-chat.png';
                a.click();
            });

        // Send message
        async function sendMessage() {
            const message = queryInput.value.trim();
            if (!message) return;

            queryInput.value = '';
            queryInput.focus();

            // Add user message
            addMessage(message, 'user');

            // Show loading
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot';
            loadingDiv.innerHTML = '<div class="label">Byte</div><div class="bubble"><div class="loading"><span></span><span></span><span></span></div></div>';
            messagesDiv.appendChild(loadingDiv);
            scrollToBottom();

            try {
                const queryLower = message.toLowerCase();

                // 0. Check for news/weather queries first
                if (queryLower.includes('news') || queryLower.includes('headlines') || queryLower.includes('more') ||
                    queryLower.includes('bbc') || queryLower.includes('reuters') || queryLower.includes('techcrunch') ||
                    queryLower.includes('cnn') || queryLower.includes('guardian') || queryLower.includes('npr') ||
                    queryLower.includes('wsj') || queryLower.includes('hackernews') || queryLower.includes('dev.to')) {

                    // Special case: just "more" means show more of previous news
                    if (queryLower.trim() === 'more') {
                        // Default to HackerNews with more items
                        const news = await getNews('hn', 20);
                        loadingDiv.remove();
                        if (news) {
                            addMessage(news, 'bot');
                        } else {
                            addMessage("❌ Couldn't fetch more news. Try again later!", 'bot');
                        }
                    } else {
                        const news = await getNews(message);
                        loadingDiv.remove();
                        if (news) {
                            addMessage(news, 'bot');
                        } else {
                            addMessage("❌ Couldn't fetch news. Try again later!", 'bot');
                        }
                    }
                } else if (queryLower.includes('define') || queryLower.includes('what does') || queryLower.includes('meaning of')) {
                    // Extract word from message
                    let word = message.toLowerCase();
                    if (word.includes('define')) {
                        word = word.split('define')[1].trim();
                    } else if (word.includes('what does')) {
                        word = word.split('what does')[1].split(/mean|say|mean\?/)[0].trim();
                    } else if (word.includes('meaning of')) {
                        word = word.split('meaning of')[1].trim();
                    }
                    word = word.replace(/[?,.!]/g, '').trim();

                    if (word.length > 0) {
                        const definition = await getDictionary(word);
                        loadingDiv.remove();
                        if (definition) {
                            addMessage(definition, 'bot');
                        } else {
                            addMessage(`❌ Couldn't find definition for "${word}". Try a different word!`, 'bot');
                        }
                    } else {
                        loadingDiv.remove();
                        addMessage("❌ Please specify a word to define!", 'bot');
                    }
                } else if (queryLower.includes('weather') || queryLower.includes('temperature') || queryLower.includes('forecast')) {
                    // Extract location if provided
                    let location = '';
                    const match = message.match(/(?:in|at)\s+([a-zA-Z\s]+)(?:\?|$)/i);
                    if (match) {
                        location = match[1].trim();
                    }
                    const weather = await getWeather(location);
                    loadingDiv.remove();
                    if (weather) {
                        addMessage(weather, 'bot');
                    } else {
                        addMessage("❌ Couldn't fetch weather. Try again later!", 'bot');
                    }
                } else if (queryLower.includes('joke') || queryLower.includes('laugh') || queryLower.includes('funny')) {
                    const joke = await getJoke();
                    loadingDiv.remove();
                    if (joke) {
                        addMessage(joke, 'bot');
                    } else {
                        addMessage("❌ Couldn't fetch a joke. Try again later!", 'bot');
                    }
                } else {
                    // 1. Simple response
                    let response = checkSimpleResponse(message);
                    if (!response) {
                        response = getTimeDate(message);
                    }

                    if (response) {
                        loadingDiv.remove();
                        addMessage(response, 'bot');
                    } else {
                        // 2. Unit converter
                        const converted = convertUnits(message);
                        if (converted) {
                            loadingDiv.remove();
                            addMessage(converted, 'bot');
                        } else {
                            // 3. Wikipedia DAT
                            const learned = await learnFromWikipedia(message);
                            loadingDiv.remove();

                        if (learned) {
                            const answer = formatResponse(learned.sentences.join('\n\n'));
                            addMessage(answer, 'bot');
                        } else {
                            addMessage("❌ I don't know that. Try asking something else!", 'bot');
                        }
                    }
                }
            } catch (error) {
                loadingDiv.remove();
                addMessage('❌ Error: ' + error.message, 'bot');
            }

            scrollToBottom();
        }

        // Add message to chat

        function formatResponse(text) {
            // Auto-format lists from Wikipedia (MAC may refer to:, etc)
            const lines = text.split('\n').map(l => l.trim()).filter(l => l); // Remove empty lines
            let result = [];
            let inList = false;
            let listNum = 1;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                // Detect list headers: "X may refer to:", "X includes:", etc
                if (/may refer to:|can mean:|include[s]?:|^.+or .+ may refer to:/i.test(line)) {
                    inList = true;
                    listNum = 1;
                    continue; // Skip the header line itself
                }

                // If we're in a list
                if (inList) {
                    // Check if this looks like it might end the list (prose vs list items)
                    // List items are typically short, list-like
                    // Prose is longer, more detailed
                    if (line.length > 150 && line.split(' ').length > 20) {
                        // Looks like prose, end the list
                        inList = false;
                        result.push(line);
                    } else {
                        // Add numbered item
                        result.push(`${listNum}. ${line}`);
                        listNum++;
                    }
                    continue;
                }

                result.push(line);
            }

            return result.join('\n');
        }

        function addMessage(content, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = type === 'user' ? 'You' : 'Byte';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = content;

            messageDiv.appendChild(label);
            messageDiv.appendChild(bubble);
            messagesDiv.appendChild(messageDiv);

            // Track conversation for context awareness
            if (type === 'user') {
                if (window.conversationHistory.length === 0 || window.conversationHistory[window.conversationHistory.length - 1].bot) {
                    window.conversationHistory.push({ user: content });
                }
            } else if (type === 'bot') {
                if (window.conversationHistory.length > 0 && !window.conversationHistory[window.conversationHistory.length - 1].bot) {
                    window.conversationHistory[window.conversationHistory.length - 1].bot = content;
                }
            }
        }

        function scrollToBottom() {
            setTimeout(() => {
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }, 0);
        }

        // Event listeners
        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Menu Popup Functionality
        const menuBtn = document.getElementById('menuBtn');
        const menuPopup = document.getElementById('menuPopup');

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuPopup.classList.toggle('hidden');
        });

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.menu-container')) {
                menuPopup.classList.add('hidden');
            }
        });

        // Export/Import Button Event Listeners
        document.getElementById('exportTextBtn').addEventListener('click', () => {
            exportAsText();
            menuPopup.classList.add('hidden');
        });
        document.getElementById('exportMarkdownBtn').addEventListener('click', () => {
            exportAsMarkdown();
            menuPopup.classList.add('hidden');
        });
        document.getElementById('exportJSONBtn').addEventListener('click', () => {
            exportAsJSON();
            menuPopup.classList.add('hidden');
        });
        document.getElementById('exportHTMLBtn').addEventListener('click', () => {
            exportAsHTML();
            menuPopup.classList.add('hidden');
        });
        document.getElementById('exportPDFBtn').addEventListener('click', () => {
            exportAsPDF();
            menuPopup.classList.add('hidden');
        });
        document.getElementById('exportImageBtn').addEventListener('click', () => {
            exportAsImage();
            menuPopup.classList.add('hidden');
        });
        document.getElementById('importBtn').addEventListener('click', () => {
            importChat();
            menuPopup.classList.add('hidden');
        });
        document.getElementById('clearBtn').addEventListener('click', () => {
            menuPopup.classList.add('hidden');
            if (confirm('Clear all chat history? This cannot be undone.')) {
                messagesDiv.innerHTML = '';
                window.conversationHistory = [];
                addMessage("Chat cleared. Start a new conversation!", 'bot');
            }
        });

        // Welcome message
        window.addEventListener('load', () => {
            addMessage("Hi! I'm Byte Mega 3.1\n\nFeatures:\n- Conversation context awareness\n- Real-time news (HackerNews, Dev.to)\n- Save & export chats (Text, Markdown, JSON, HTML, PDF, Image)\n\nTry:\n- Ask about a topic, then say 'tell me more'\n- Use the + menu to export/import chats\n- Math expressions or ask anything!", 'bot');
            queryInput.focus();
        });
    </script>


    <script>
        const APP_VERSION = '3.1.0';

        // Handle service worker updates
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('message', event => {
                if (event.data.type === 'UPDATE_AVAILABLE') {
                    console.log('Update available:', event.data.version);
                    showUpdateBanner();
                }
            });

            // Register service worker
            navigator.serviceWorker.register('service-worker.js').then(reg => {
                console.log('Service Worker registered ✓');

                // Check for updates every 5 minutes
                setInterval(() => {
                    if (reg.controller) {
                        reg.controller.postMessage({ type: 'CHECK_UPDATE' });
                    }
                }, 5 * 60 * 1000);

                // Check for updates on page load
                if (reg.controller) {
                    reg.controller.postMessage({ type: 'CHECK_UPDATE' });
                }
            }).catch(err => {
                console.log('Service Worker registration failed:', err);
            });
        }

        function showUpdateBanner() {
            const banner = document.getElementById('updateBanner');
            if (banner) {
                banner.classList.add('show');
            }
        }

        function dismissUpdate() {
            const banner = document.getElementById('updateBanner');
            if (banner) {
                banner.classList.remove('show');
            }
        }

        function updateApp() {
            // Clear all caches to force fresh download
            if ('caches' in window) {
                caches.keys().then(names => {
                    names.forEach(name => caches.delete(name));
                });
            }
            // Reload the page
            window.location.reload(true);
        }
    </script>
